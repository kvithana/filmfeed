name: Bug
description: A feed returned the wrong movies, or a deployment step failed.
title: ""
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the feed URL path (no API keys) and the response status.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
